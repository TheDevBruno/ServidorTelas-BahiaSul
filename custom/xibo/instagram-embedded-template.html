<!-- 3. JAVASCRIPT (Cole no campo JavaScript do Widget Incorporado / Embedded no Xibo) -->
<script>
// LISTA DE LINKS / IDs DAS POSTAGENS REAIS PUBLICADAS NO INSTAGRAM DA BAHIASUL
// (Basta abrir qualquer post no Instagram, copiar o link da barra de endereço e colar aqui!):
const realInstagramPosts = [
    'https://www.instagram.com/conexaobahiasul/embed', // Embed do Perfil Oficial
];

let postIframeIndex = 0;

function loadNextInstagramPost() {
    const iframe = document.getElementById('instaIframe');
    if (!iframe) return;

    iframe.src = realInstagramPosts[postIframeIndex];
    postIframeIndex = (postIframeIndex + 1) % realInstagramPosts.length;
}

loadNextInstagramPost();
setInterval(loadNextInstagramPost, 12000); // Alterna postagem real a cada 12 segundos
</script>
