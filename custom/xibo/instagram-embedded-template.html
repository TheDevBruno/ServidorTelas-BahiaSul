<!-- 3. JAVASCRIPT (Cole no campo JavaScript do Widget Incorporado / Embedded no Xibo) -->
<script>
// LISTA DOS LINKS DAS SUAS POSTAGENS REAIS PUBLICADAS NO INSTAGRAM DA BAHIASUL:
const instagramPostUrls = [
    'https://www.instagram.com/p/Ddq7HAdEY7v/',
    'https://www.instagram.com/p/DdzF3FkkXvI/',
    'https://www.instagram.com/reel/DcBaGhzxQFd/',
    'https://www.instagram.com/reel/DdkE9o8M_mq/'
];

let currentPostIdx = 0;

function loadInstagramSDK(callback) {
    if (window.instgrm) {
        callback();
        return;
    }
    const script = document.createElement('script');
    script.src = 'https://www.instagram.com/embed.js';
    script.async = true;
    script.onload = callback;
    document.body.appendChild(script);
}

function renderOfficialInstagramPost() {
    const slot = document.getElementById('instaPostSlot');
    if (!slot) return;

    const url = instagramPostUrls[currentPostIdx];
    slot.innerHTML = `
        <blockquote class="instagram-media" data-instgrm-permalink="${url}" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; margin: 0; width:100%; max-width:500px;">
        </blockquote>
    `;

    loadInstagramSDK(() => {
        if (window.instgrm && window.instgrm.Embeds) {
            window.instgrm.Embeds.process();
        }
    });

    currentPostIdx = (currentPostIdx + 1) % instagramPostUrls.length;
}

renderOfficialInstagramPost();
setInterval(renderOfficialInstagramPost, 12000); // Alterna posts reais a cada 12 segundos
</script>
