<script>
// Lista de Publicações e Fotos do Perfil Instagram @conexaobahiasul
// (Adicione ou altere as imagens e frases da equipe/serviços conforme suas campanhas):
const instagramPosts = [
    {
        image: 'https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=600&q=80',
        caption: 'Ultravelocidade com estabilidade real para sua casa e empresa. Conheça nossos planos de Fibra Óptica!'
    },
    {
        image: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80',
        caption: 'Atendimento humanizado e suporte ágil na BahiaSul. Conectando você a quem você ama!'
    },
    {
        image: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80',
        caption: 'Mídia Indoor BahiaSul: Leve sua marca para milhares de pessoas em locais estratégicos da região.'
    }
];

let currentPostIndex = 0;

function renderInstagramPost() {
    const card = document.getElementById('instaCard');
    if (!card) return;

    card.style.opacity = '0.2';

    setTimeout(() => {
        const post = instagramPosts[currentPostIndex];
        const imgEl = document.getElementById('postImage');
        const captionEl = document.getElementById('postCaption');

        if (imgEl) imgEl.src = post.image;
        if (captionEl) captionEl.textContent = post.caption;

        card.style.opacity = '1';
        currentPostIndex = (currentPostIndex + 1) % instagramPosts.length;
    }, 350);
}

renderInstagramPost();
setInterval(renderInstagramPost, 10000); // Rotaciona as fotos dos posts a cada 10 segundos
</script>
