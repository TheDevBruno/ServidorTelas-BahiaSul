        date: 'Conexão BahiaSul • Foto 10 de 10'
    }
];

let postIdx = 0;

function renderPost() {
    const imgEl = document.getElementById('postImage');
    const captionEl = document.getElementById('postCaption');
    const dateEl = document.getElementById('postDate');
    if (!imgEl || !captionEl) return;

    const post = instagramPosts[postIdx];
    imgEl.src = post.image;
    captionEl.textContent = post.caption;
    if (dateEl) dateEl.textContent = post.date;

    postIdx = (postIdx + 1) % instagramPosts.length;
}

renderPost();
setInterval(renderPost, 10000); // Alterna publicação a cada 10 segundos
</script>
