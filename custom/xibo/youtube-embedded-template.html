<!-- ==========================================================================
   WIDGET HTML INCORPORADO (YOUTUBE AUTOPLAY PLAYER) — CONEXÃO BAHIASUL
   ========================================================================== -->

<!-- 1. HTML (Cole no campo HTML do Widget Incorporado / Embedded no Xibo) -->
<div class="bahiasul-youtube-container">
    <div id="player"></div>
</div>

<!-- 2. CSS (Cole no campo CSS do Widget Incorporado / Embedded no Xibo) -->
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
}

.bahiasul-youtube-container {
    width: 100%;
    height: 100%;
    position: relative;
}

.bahiasul-youtube-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>

<!-- 3. JAVASCRIPT (Cole no campo JavaScript do Widget Incorporado / Embedded no Xibo) -->
<script>
// ID do Vídeo do YouTube (ex: para https://www.youtube.com/watch?v=NE_lF0tSDuE o ID é NE_lF0tSDuE):
const YOUTUBE_VIDEO_ID = 'NE_lF0tSDuE';

let player;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
            'autoplay': 1,
            'controls': 0,
            'loop': 1,
            'playlist': YOUTUBE_VIDEO_ID,
            'rel': 0,
            'showinfo': 0,
            'modestbranding': 1,
            'playsinline': 1
        },
        events: {
            'onReady': onPlayerReady
        }
    });
}

function onPlayerReady(event) {
    // Inicia a reprodução garantida do vídeo para não ficar em tela preta
    event.target.playVideo();
    
    // Tenta liberar o som automaticamente após a inicialização
    setTimeout(() => {
        try {
            event.target.unMute();
            event.target.setVolume(100);
        } catch(e) {}
    }, 1200);
}

// Carrega o SDK Oficial da API Iframe do YouTube
if (!window.YT) {
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
} else if (window.YT && window.YT.Player) {
    onYouTubeIframeAPIReady();
}
</script>
