<!-- ==========================================================================
   WIDGET CARD DE NOTÍCIAS (NEWS CARD) — CONEXÃO BAHIASUL
   ========================================================================== -->

<!-- 1. HTML (Cole no campo HTML do Widget Incorporado / Embedded no Xibo) -->
<div class="bahiasul-news-card" id="newsCard">
    <div class="card-header">
        <span class="card-badge">ÚLTIMAS NOTÍCIAS</span>
        <span class="card-source" id="newsSource">BahiaSul Notícias</span>
    </div>

    <div class="card-media" id="cardMedia" style="display: none;">
        <img id="newsImage" src="" alt="Notícia" />
    </div>

    <div class="card-body">
        <h2 class="news-title" id="newsTitle">Carregando últimas notícias...</h2>
        <p class="news-description" id="newsDescription">Acompanhe as principais informações em tempo real no canal BahiaSul Mídia Indoor.</p>
    </div>

    <div class="card-footer">
        <span class="news-date" id="newsDate">Conexão BahiaSul</span>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
</div>

<!-- 2. CSS (Cole no campo CSS do Widget Incorporado / Embedded no Xibo) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Montserrat', sans-serif;
}

.bahiasul-news-card {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: #FFFFFF;
    border-radius: 12px;
    border-left: 6px solid #F26D21; /* Laranja BahiaSul */
    box-shadow: 0 8px 24px rgba(11, 57, 96, 0.12);
    box-sizing: border-box;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: opacity 0.4s ease-in-out;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 2px solid #F1F5F9;
    padding-bottom: 12px;
}

.card-badge {
    background-color: #0B3960; /* Azul Escuro */
    color: #F26D21; /* Laranja */
    font-weight: 800;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.card-source {
    color: #64748B;
    font-size: 13px;
    font-weight: 600;
}

.card-media {
    width: 100%;
    max-height: 240px;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #F8FAFC;
}

.card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

.card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
}

.news-title {
    color: #0B3960;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.35;
    margin: 0 0 12px 0;
}

.news-description {
    color: #333333;
    font-size: 16px;
    line-height: 1.55;
    font-weight: 400;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-footer {
    display: flex;
    flex-direction: column;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid #F1F5F9;
}

.news-date {
    font-size: 12px;
    color: #94A3B8;
    font-weight: 600;
    margin-bottom: 10px;
}

.progress-container {
    width: 100%;
    height: 4px;
    background-color: #E2E8F0;
    border-radius: 2px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background-color: #F26D21;
    transition: width 0.1s linear;
}
</style>

<!-- 3. JAVASCRIPT (Cole no campo JavaScript do Widget Incorporado / Embedded no Xibo) -->
<script>
// URL DO FEED RSS DESEJADO (Ex: G1, UOL, CNN, Feeds Locais):
const RSS_FEED_URL = 'https://g1.globo.com/rss/g1/';
const DISPLAY_DURATION_SEC = 8; // Tempo de exibição de cada notícia (em segundos)

let newsItems = [];
let currentIndex = 0;
let progressInterval = null;

async function fetchNews() {
    try {
        const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_FEED_URL);
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 'ok' && data.items && data.items.length > 0) {
            newsItems = data.items;
            document.getElementById('newsSource').textContent = data.feed.title || 'Mídia Indoor BahiaSul';
            showCurrentNews();
        }
    } catch (e) {
        console.log('Erro ao carregar feed do Card');
    }
}

function showCurrentNews() {
    if (newsItems.length === 0) return;

    const card = document.getElementById('newsCard');
    card.style.opacity = '0.1';

    setTimeout(() => {
        const item = newsItems[currentIndex];
        document.getElementById('newsTitle').textContent = item.title;

        // Limpa tags HTML da descrição se houver
        const cleanDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '') : '';
        document.getElementById('newsDescription').textContent = cleanDesc;

        // Formatação de data
        if (item.pubDate) {
            const dateObj = new Date(item.pubDate);
            document.getElementById('newsDate').textContent = 'Atualizado em ' + dateObj.toLocaleDateString('pt-BR') + ' às ' + dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        }

        // Imagem se houver no item
        const imgElement = document.getElementById('newsImage');
        const mediaElement = document.getElementById('cardMedia');
        const imageSrc = (item.enclosure && item.enclosure.link) ? item.enclosure.link : (item.thumbnail ? item.thumbnail : null);

        if (imageSrc) {
            imgElement.src = imageSrc;
            mediaElement.style.display = 'flex';
        } else {
            mediaElement.style.display = 'none';
        }

        card.style.opacity = '1';
        startProgressBar();
    }, 350);
}

function startProgressBar() {
    clearInterval(progressInterval);
    const bar = document.getElementById('progressBar');
    let elapsed = 0;
    const stepMs = 100;
    const totalMs = DISPLAY_DURATION_SEC * 1000;

    progressInterval = setInterval(() => {
        elapsed += stepMs;
        const percent = (elapsed / totalMs) * 100;
        bar.style.width = percent + '%';

        if (elapsed >= totalMs) {
            clearInterval(progressInterval);
            currentIndex = (currentIndex + 1) % newsItems.length;
            showCurrentNews();
        }
    }, stepMs);
}

fetchNews();
setInterval(fetchNews, 15 * 60 * 1000); // Atualiza o feed a cada 15 min
</script>
